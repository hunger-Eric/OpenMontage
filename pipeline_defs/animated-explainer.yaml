name: animated-explainer
version: "2.0"
description: >
  Generated explainer video from topic/idea - fully AI-produced with narration, visuals, and music.
  Features a research-first pre-production phase: the agent researches the topic, proposes concepts
  with cost estimates, and gets explicit user approval before any assets are generated.
category: generated
stability: production

default_checkpoint_policy: guided

# Reference video input support
reference_input:
  supported: true
  analysis_depth: standard
  analysis_tools:
    - video_analyzer
    - reference_media
    - transcript_fetcher
    - video_downloader
    - scene_detect
    - frame_sampler

extensions:
  custom_scripts: true
  custom_playbooks: true
  custom_skills: true
  custom_tools: false

required_skills:
  - pipelines/explainer/executive-producer
  - pipelines/explainer/research-director
  - pipelines/explainer/proposal-director
  - pipelines/explainer/script-director
  - pipelines/explainer/scene-director
  - pipelines/explainer/asset-director
  - pipelines/explainer/edit-director
  - pipelines/explainer/compose-director
  - pipelines/explainer/publish-director
  - meta/reviewer
  - meta/checkpoint-protocol
  - meta/skill-creator
  - meta/animation-runtime-selector
  - meta/voice-performance-director

orchestration:
  max_revisions_per_stage: 3
  max_send_backs: 3
  mode: executive-producer
  skill: pipelines/explainer/executive-producer

compatible_playbooks:
  recommended:
    - clean-professional
    - flat-motion-graphics
  also_works:
    - minimalist-diagram
  custom_allowed: true

stages:
  # ── Pre-Production ──────────────────────────────────────────────

  - name: research
    skill: pipelines/explainer/research-director
    produces:
      - research_brief
    tools_available: []
    checkpoint_required: false
    human_approval_default: false
    review_focus:
      - Content landscape mapped with at least 3 existing pieces
      - Data points are specific and sourced, not vague
      - Audience questions sourced from real forums, not invented
      - At least 3 genuinely different angles discovered
      - All angles grounded in specific research findings
    success_criteria:
      - Schema-valid research_brief with at least 3 data_points
      - At least 3 angles_discovered, each with grounded_in references
      - At least 5 sources cited with URLs

  - name: proposal
    skill: pipelines/explainer/proposal-director
    required_artifacts_in:
      - research_brief
    produces:
      - proposal_packet
      - decision_log
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Reuse one technical handoff check; required fields and selected concept reference are valid
      - Text is readable; existing research and capability evidence are reused without another audit
      - No subjective concept scoring or comparative quality review; the user evaluates the complete plan board
    success_criteria:
      - Schema-valid proposal_packet with at least one concept; multiple options only when requested
      - selected_concept references a valid concept_id
      - cost_estimate has itemized line_items with per-tool billing/usage and no invented zero-dollar plan usage
      - Proposal approval may remain pending until complete-plan confirmation at scene_plan
  # ── Production ──────────────────────────────────────────────────

  - name: script
    skill: pipelines/explainer/script-director
    required_artifacts_in:
      - proposal_packet
    optional_artifacts_in:
      - research_brief
    produces:
      - script
    tools_available: []
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - One combined review reused by the owner and checkpoint; no repeated scoring of unchanged text
      - Content follows the user's direction, has coherent spoken progression and research-backed claims
      - Timing estimated for the actual language and delivery; useful visual and speaker cues are present
    success_criteria:
      - Schema-valid script with enhancement_cues per section
      - Total duration matches selected concept target within 10%

  - name: scene_plan
    skill: pipelines/explainer/scene-director
    required_artifacts_in:
      - script
    optional_artifacts_in:
      - proposal_packet
      - decision_log
    produces:
      - scene_plan
    tools_available:
      - image_selector
      - feishu_video_plan
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - "Technical delivery only: readable text, real images loaded with preserved aspect ratio, required plan fields present"
      - Published project board link and required prompt/image controls work; reuse one verification result
      - The user judges creative quality on the complete board; no separate internal creative scoring
      - Playbook adherence - transitions, colors, pacing rules
    success_criteria:
      - Complete video plan and necessary actual references are presented before generation
      - Human approval binds the exact plan revision and automatic or manual execution choice
      - Schema-valid scene_plan with required_assets per scene
      - At least 3 different scene types used

  - name: assets
    skill: pipelines/explainer/asset-director
    required_artifacts_in:
      - scene_plan
      - script
    optional_artifacts_in:
      - proposal_packet
      - decision_log
    produces:
      - asset_manifest
    required_tools:
      - tts_selector
      - image_selector
    optional_tools:
      - video_selector
      - video_trimmer
      - math_animate
      - diagram_gen
      - code_snippet
      - music_gen
    tools_available:
      - tts_selector
      - image_selector
      - video_selector
      - video_trimmer
      - diagram_gen
      - code_snippet
      - music_gen
      - math_animate
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - All asset files exist on disk
      - Narration covers all script sections
      - Narration assets apply the approved voice performance plan and sample settings
      - Provider attempts and actual usage are reconciled; an explicit user budget cap is honored when present
      - Generated motion has model-owned semantic review receipts before batch continuation
      - Image style consistency across all generated visuals
    success_criteria:
      - Schema-valid asset_manifest with all required assets generated
      - All file paths resolve to existing files

  - name: edit
    skill: pipelines/explainer/edit-director
    required_artifacts_in:
      - scene_plan
      - asset_manifest
    optional_artifacts_in:
      - script
    produces:
      - edit_decisions
    tools_available:
      - media_prepare
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - All cuts reference valid assets from manifest
      - Subtitles enabled with playbook-compatible styling
      - Music configured with ducking parameters
      - No timeline gaps or overlaps
    success_criteria:
      - Schema-valid edit_decisions
      - Full video duration covered

  - name: compose
    skill: pipelines/explainer/compose-director
    required_artifacts_in:
      - edit_decisions
      - asset_manifest
    optional_artifacts_in:
      - scene_plan
      - proposal_packet
      - decision_log
    produces:
      - render_report
      - final_review
    required_tools:
      - video_compose
      - audio_mixer
      - transcriber
    optional_tools:
      - video_stitch
    tools_available:
      - video_compose
      - video_stitch
      - audio_mixer
      - transcriber
    checkpoint_required: true
    human_approval_default: false
    review_focus:
      - Output video exists and is playable
      - "Duration within +/-5% of target"
      - Audio is clear with proper narration/music balance
      - final_review records audio measurements and model/owner mix review; only declared enforced style thresholds block
      - final_review transcript_comparison confirms the final spoken audio matches the approved script
      - final_review semantic_alignment confirms generated motion realizes identity/action/continuity requirements
      - Approved semantic deviations have matching decision_log entries and revised source artifacts
      - Sampled frames contain no unintended pillarbox or letterbox borders
      - Subtitles are generated from the final narration transcript, never projected from script timing alone
      - Background music is no more than 20 LU below narration before optional ducking
      - Final rendering enters through video_compose; low-level runtime tools are not delivery entry points
      - "render_runtime in edit_decisions matches proposal_packet — silent swap to another runtime is a CRITICAL governance violation"
      - "If render_runtime='hyperframes': `hyperframes lint` and `hyperframes validate` must pass before render"
    success_criteria:
      - Schema-valid render_report with output paths
      - Output file exists and passes ffprobe validation
      - final_review.status is pass; revise and fail are non-deliverable
      - Missing, unreadable, empty, or below-threshold narration transcription is non-deliverable
      - Pre-authorized runs repair and re-render until final_review passes or a real external blocker/user decision is required

  - name: publish
    skill: pipelines/explainer/publish-director
    required_artifacts_in:
      - render_report
      - final_review
    optional_artifacts_in:
      - proposal_packet
    produces:
      - publish_log
    tools_available: [export_bundle]
    checkpoint_required: true
    human_approval_default: true
    review_focus:
      - SEO metadata complete and keyword-rich
      - Chapter markers present
      - Export package structured correctly
    success_criteria:
      - Schema-valid publish_log
      - Export directory contains video, metadata, and thumbnail concept
